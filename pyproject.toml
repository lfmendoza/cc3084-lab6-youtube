[project]
name = "cc3084-lab6-youtube"
version = "1.0.0"
description = "CC3084 Data Science - Laboratorio 6: Analisis de redes sociales (YouTube)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "nltk>=3.9",
    "spacy>=3.8",
    "emoji>=2.12",
    "wordcloud>=1.9",
    "transformers>=4.44",
    "torch>=2.4",
    "tokenizers>=0.19",
    "sentencepiece>=0.2",
    "reportlab>=4.2",
    "pypdf>=4.3",
    "pytest>=8.3",
    "unidecode>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv]
package = false
